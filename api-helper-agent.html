<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24; --border: #2a2a3a;
    --text: #e8e8f0; --muted: #6b6b88; --accent: #7c6dfa; --accent2: #fa6d8a;
    --green: #4dffa0; --yellow: #ffd84d; --cyan: #4dd9ff;
  }
  body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(124,109,250,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(124,109,250,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
  header { padding: 48px 0 40px; border-bottom: 1px solid var(--border); }
  .header-inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .logo-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; font-size: 11px; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 16px; }
  .logo-badge span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  h1 { font-family:'Syne',sans-serif; font-size:clamp(32px,5vw,56px); font-weight:800; line-height:1.0; letter-spacing:-0.03em; }
  h1 em { font-style:normal; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .subtitle { margin-top:12px; color:var(--muted); font-size:13px; font-weight:300; }
  .stats { display:flex; gap:32px; }
  .stat-num { font-family:'Syne',sans-serif; font-size:28px; font-weight:700; }
  .stat-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-top:2px; }
  .section-header { display:flex; align-items:center; gap:12px; padding:32px 0 20px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.15em; }
  .section-header::after { content:''; flex:1; height:1px; background:var(--border); }
  .platforms-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:12px; margin-bottom:48px; }
  .platform-card { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; cursor:pointer; transition:all 0.2s; overflow:hidden; }
  .platform-card::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at top left,var(--cc,var(--accent)) 0%,transparent 60%); opacity:0; transition:opacity 0.3s; }
  .platform-card:hover::before, .platform-card.active::before { opacity:.08; }
  .platform-card:hover { border-color:var(--cc,var(--accent)); transform:translateY(-2px); }
  .platform-card.active { border-color:var(--cc,var(--accent)); background:var(--surface2); }
  .platform-card.active .pname { color:var(--cc,var(--accent)); }
  .picon { width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:12px; background:rgba(255,255,255,.05); }
  .pname { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; margin-bottom:4px; transition:color 0.2s; }
  .pmeta { font-size:10px; color:var(--muted); }
  .pcount { position:absolute; top:12px; right:12px; font-size:10px; color:var(--muted); background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:2px 6px; }
  .endpoints-panel { display:none; animation:slideUp 0.3s ease; }
  .endpoints-panel.visible { display:block; }
  @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .panel-header { display:flex; align-items:center; justify-content:space-between; padding:24px 0 20px; border-top:1px solid var(--border); flex-wrap:wrap; gap:12px; }
  .ptitle { display:flex; align-items:center; gap:12px; }
  .pbadge { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; }
  .pclose { background:var(--surface); border:1px solid var(--border); border-radius:6px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:16px; transition:all 0.2s; }
  .pclose:hover { color:var(--text); border-color:var(--muted); }
  .sbox { flex:1; min-width:200px; position:relative; }
  .sbox input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 16px 10px 40px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; transition:border-color 0.2s; }
  .sbox input:focus { border-color:var(--accent); }
  .sbox input::placeholder { color:var(--muted); }
  .sicon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; }
  .fbtns { display:flex; gap:8px; flex-wrap:wrap; }
  .fbtn { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:8px 14px; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:11px; cursor:pointer; transition:all 0.2s; text-transform:uppercase; letter-spacing:.08em; }
  .fbtn:hover,.fbtn.active { border-color:var(--accent); color:var(--accent); background:rgba(124,109,250,.08); }
  .ep-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:12px; }
  .ep-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 18px; transition:all 0.18s; position:relative; }
  .ep-card:hover { border-color:var(--epc,var(--border)); background:var(--surface2); }
  .ep-card:hover .epath { color:var(--epc,var(--muted)); }
  .ep-top { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .mbadge { font-size:10px; font-weight:500; letter-spacing:.08em; padding:3px 8px; border-radius:4px; flex-shrink:0; margin-top:2px; }
  .GET    { background:rgba(77,255,160,.12); color:var(--green); border:1px solid rgba(77,255,160,.2); }
  .POST   { background:rgba(124,109,250,.12); color:var(--accent); border:1px solid rgba(124,109,250,.2); }
  .PUT    { background:rgba(255,216,77,.10); color:var(--yellow); border:1px solid rgba(255,216,77,.2); }
  .DELETE { background:rgba(250,109,138,.10); color:var(--accent2); border:1px solid rgba(250,109,138,.2); }
  .PATCH  { background:rgba(77,217,255,.10); color:var(--cyan); border:1px solid rgba(77,217,255,.2); }
  .etblock { flex:1; min-width:0; }
  .ename { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .epath { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color 0.2s; }
  .edesc { font-size:12px; color:var(--muted); line-height:1.6; font-weight:300; }
  .etags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .etag { font-size:10px; padding:2px 8px; background:var(--surface2); border:1px solid var(--border); border-radius:4px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .cpbtn { position:absolute; top:12px; right:12px; background:var(--surface2); border:1px solid var(--border); border-radius:5px; padding:4px 8px; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); cursor:pointer; opacity:0; transition:all 0.2s; }
  .ep-card:hover .cpbtn { opacity:1; }
  .cpbtn:hover { color:var(--text); border-color:var(--muted); }
  .cpbtn.done { color:var(--green); border-color:var(--green); }
  .empty { text-align:center; padding:60px 24px; color:var(--muted); font-size:13px; }
  .cgrp { margin-bottom:32px; }
  .clabel { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.15em; padding:0 0 12px; display:flex; align-items:center; gap:10px; }
  .clabel::after { content:''; flex:1; height:1px; background:var(--border); }
  .ep-wrap { padding-bottom:60px; }
  ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-inner">
      <div>
        <div class="logo-badge"><span></span> Live Reference</div>
        <h1><em>Sharday</em></h1>
        <p class="subtitle">// Select a platform to explore its endpoints</p>

      <div class="ptitle">

        <span class="pbadge" id="pname"></span>
        <span style="font-size:12px;color:var(--muted)" id="pcnt"></span>

          <button class="fbtn" data-m="PUT">PUT</button>
          <button class="fbtn" data-m="PATCH">PATCH</button>
          <button class="fbtn" data-m="DELETE">DEL</button>
        </div>
        <div class="pclose" id="pclose">✕</div>

    </div>
    <div id="econt"></div>
  </div>
</div>

// ── Boot ──
const pgrid = document.getElementById('pgrid');
let active=null, method='ALL', query='';
const total = Object.values(P).reduce((s,p)=>s+p.endpoints.length,0);
document.getElementById('teps').textContent = total+'+';

Object.entries(P).forEach(([k,p])=>{
  const c=document.createElement('div');
  c.className='platform-card';
  c.style.setProperty('--cc',p.color);
  c.innerHTML=`<div class="pcount">${p.endpoints.length}</div><div class="picon">${p.icon}</div><div class="pname">${p.name}</div><div class="pmeta">${p.type}</div>`;
  c.addEventListener('click',()=>sel(k,c));
  pgrid.appendChild(c);
});

function sel(k,c){
  if(active===k){close();return;}
  document.querySelectorAll('.platform-card').forEach(x=>x.classList.remove('active'));
  c.classList.add('active'); active=k; method='ALL'; query='';
  document.getElementById('esearch').value='';
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active',b.dataset.m==='ALL'));
  render(k);
  setTimeout(()=>document.getElementById('epanel').scrollIntoView({behavior:'smooth',block:'start'}),50);
}
function close(){
  document.getElementById('epanel').classList.remove('visible');
  document.querySelectorAll('.platform-card').forEach(c=>c.classList.remove('active'));
  active=null;
}
function render(k){
  const p=P[k];
  document.getElementById('picon').textContent=p.icon;
  document.getElementById('pname').textContent=p.name;
  document.getElementById('epanel').classList.add('visible');
  const q=query.toLowerCase();
  const eps=p.endpoints.filter(e=>{
    if(method!=='ALL'&&e.m!==method)return false;
    if(q&&!e.n.toLowerCase().includes(q)&&!e.p.toLowerCase().includes(q)&&!e.d.toLowerCase().includes(q)&&!e.t.some(t=>t.includes(q)))return false;
    return true;
  });
  document.getElementById('pcnt').textContent=`${eps.length} endpoint${eps.length!==1?'s':''}`;
  const ec=document.getElementById('econt');
  if(!eps.length){ec.innerHTML='<div class="empty">🔍 No endpoints match your filter.</div>';return;}
  const groups={};
  eps.forEach(e=>{const g=e.t[0]||'other';if(!groups[g])groups[g]=[];groups[g].push(e);});
  ec.innerHTML='<div class="ep-wrap">'+Object.entries(groups).map(([cat,list])=>`
    <div class="cgrp">
      <div class="clabel">${cat}</div>
      <div class="ep-grid">${list.map(e=>`
        <div class="ep-card" style="--epc:${p.color}">
          <button class="cpbtn" onclick="cp(event,'${e.p.replace(/'/g,"\\'")}')">copy path</button>
          <div class="ep-top">
            <span class="mbadge ${e.m}">${e.m}</span>
            <div class="etblock">
              <div class="ename">${e.n}</div>
              <div class="epath">${e.p}</div>
            </div>
          </div>
          <div class="edesc">${e.d}</div>
          <div class="etags">${e.t.map(t=>`<span class="etag">${t}</span>`).join('')}</div>
        </div>`).join('')}
      </div>
    </div>`).join('')+'</div>';
}
function cp(e,path){
  e.stopPropagation();
  navigator.clipboard.writeText(path).catch(()=>{});
  const b=e.target; b.textContent='copied!'; b.classList.add('done');
  setTimeout(()=>{b.textContent='copy path';b.classList.remove('done');},1500);
}
document.getElementById('pclose').addEventListener('click',close);
document.getElementById('mfilters').addEventListener('click',e=>{
  if(!e.target.dataset.m)return;
  method=e.target.dataset.m;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active',b.dataset.m===method));
  if(active)render(active);
});
document.getElementById('esearch').addEventListener('input',e=>{
  query=e.target.value; if(active)render(active);
});
</script>
